version: 2.1

workflows:
  main:
    jobs:
      - build-and-test
      - govulncheck

jobs:
  build-and-test:
    docker: &docker
      - image: cimg/go:1.25.0
    steps:
      - checkout
      - run: go vet ./...
      - run: go test ./...
  govulncheck:
    docker: *docker
    steps:
      - checkout
      - run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - run: govulncheck ./...
